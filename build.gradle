plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}
version = mod_version
group = 'com.chunkworks.magicalmap'
base { archivesName = 'magicalmap' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
    // EMI (recipe viewer): API for the optional plugin, full jar for the booth only.
    maven { url = 'https://maven.terraformersmc.com/releases/'; content { includeGroup 'dev.emi' } }
}
def emi = 'dev.emi:emi-neoforge:1.1.24+1.21.1'
sourceSets { domain; gametest }
def prepare = tasks.register('prepareVerification') {
    doLast {
        ['run/config', 'run/booth/config'].each { name ->
            def directory = file(name)
            directory.mkdirs()
            new File(directory, 'fml.toml').text = 'disableConfigWatcher=true\nearlyWindowControl=false\n'
        }
    }
}
def resetWorld = tasks.register('resetGameTestWorld', Delete) { delete 'run/world' }
def structures = tasks.register('copyGameTestStructures', Copy) {
    from 'devtools/gameteststructures'
    into 'run/gameteststructures'
}
def boothWorld = tasks.register('prepareBoothWorld', Sync) {
    outputs.upToDateWhen { false }
    doFirst { delete 'run/booth/screenshots' }
    from 'run/world'
    into 'run/booth/saves/booth'
    exclude 'session.lock'
    doLast {
        file('run/booth/options.txt').text = 'onboardAccessibility:false\nnarrator:0\nsoundCategory_master:0.0\npauseOnLostFocus:false\nrenderDistance:8\nsimulationDistance:5\nmaxFps:30\nguiScale:2\ntutorialStep:none\n'
    }
}
def resumePlaytest = file('run/playtest/saves/atlas-playtest/level.dat').isFile() && !project.hasProperty('playtestReset')
def playtestWorld = tasks.register('preparePlaytestWorld', Sync) {
    onlyIf { !resumePlaytest && !project.hasProperty('playtestResume') }
    outputs.upToDateWhen { false }
    doFirst {
        if (!file('run/world/level.dat').isFile()) {
            throw new GradleException('Create the disposable template first: ./gradlew runGameTestServer')
        }
        ['mobilecamp-0.2.0.jar', 'villagedeed-1.0.0.jar', 'thief-neoforge-1.21.1-1.2.4.jar'].each { name ->
            if (!file("devtools/integration/${name}").isFile()) throw new GradleException("Playtest requires devtools/integration/${name}")
        }
    }
    from 'run/world'
    into 'run/playtest/saves/atlas-playtest'
    exclude 'session.lock'
    doLast {
        file('run/playtest/config').mkdirs()
        file('run/playtest/config/fml.toml').text = 'disableConfigWatcher=true\nearlyWindowControl=false\n'
        file('run/playtest/options.txt').text = 'onboardAccessibility:false\nnarrator:0\nsoundCategory_master:0.0\npauseOnLostFocus:false\nrenderDistance:8\nsimulationDistance:5\nmaxFps:120\nguiScale:2\ntutorialStep:none\n'
        copy { from 'run/booth/mods'; into 'run/playtest/mods' }
        copy { from 'run/booth/shaderpacks'; into 'run/playtest/shaderpacks' }
        copy { from 'run/booth/config/iris.properties'; into 'run/playtest/config' }
    }
}
neoForge {
    version = '21.1.248'
    parchment { minecraftVersion = '1.21.1'; mappingsVersion = '2024.11.17' }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', 'magicalmap'
            taskBefore structures
            taskBefore resetWorld
            taskBefore prepare
        }
        photoBooth {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/booth')
            systemProperty 'magicalmap.booth', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'booth', '--width', '1280', '--height', '720')
            taskBefore boothWorld
            taskBefore prepare
        }
        playtest {
            client()
            sourceSet = sourceSets.gametest
            gameDirectory = file('run/playtest')
            systemProperty 'magicalmap.playtest', 'true'
            systemProperty 'magicalmap.playtest.resume', resumePlaytest.toString()
            programArguments.addAll('--quickPlaySingleplayer', 'atlas-playtest', '--width', '1280', '--height', '720')
            taskBefore playtestWorld
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        magicalmap { sourceSet(sourceSets.domain); sourceSet(sourceSets.main) }
        magicalmap_gametest { sourceSet(sourceSets.gametest) }
    }
    addModdingDependenciesTo(sourceSets.gametest)
}
neoForge.runs.matching { !(it.name in ['gameTestServer', 'photoBooth', 'playtest']) }.configureEach {
    loadedMods = neoForge.mods.matching { it.name != 'magicalmap_gametest' }
}
dependencies {
    implementation sourceSets.domain.output
    gametestImplementation sourceSets.main.output
    gametestImplementation sourceSets.domain.output
    testImplementation sourceSets.domain.output
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
    // Optional, actual upstream jars for integration verification. Never embedded.
    gametestRuntimeOnly fileTree('devtools/integration') { include '*.jar' }
    compileOnly "${emi}:api"
    gametestCompileOnly "${emi}:api"
    gametestRuntimeOnly emi
}
tasks.named('test', Test) { useJUnitPlatform() }
jar { from sourceSets.domain.output }
tasks.named('processResources') {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('runGameTestServer') {
    doLast {
        def log = file('run/logs/latest.log').text
        def passed = log =~ /All (\d+) required tests passed/
        if (!passed.find() || log.contains('Mod loading has failed')) throw new GradleException('GameTests failed')
        logger.lifecycle('GameTests: ' + passed.group(1) + ' passed')
    }
}
tasks.named('runPhotoBooth') {
    mustRunAfter 'runGameTestServer'
    doLast {
        def log = file('run/booth/logs/latest.log').text
        if (!log.contains('atlas booth: COMPLETE') || log.contains('atlas booth: FAIL')) throw new GradleException('Atlas booth failed')
    }
}
tasks.named('prepareBoothWorld') { mustRunAfter 'runGameTestServer' }
tasks.named('runPlaytest') {
    doFirst {
        if (project.hasProperty('playtestResume') && !file('run/playtest/saves/atlas-playtest/level.dat').isFile()) {
            throw new GradleException('No practice world to resume; launch without --resume first')
        }
    }
}
tasks.named('check') {
    if (!project.hasProperty('skipGameTests')) dependsOn 'runGameTestServer'
    if (!project.hasProperty('skipBooth')) dependsOn 'runPhotoBooth'
}
